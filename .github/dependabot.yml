version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # mcp 2.x renamed FastMCP and changed the API; migrating is a separate task
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
