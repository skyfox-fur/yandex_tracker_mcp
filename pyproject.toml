[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-tracker-mcp"
version = "0.2.0"
description = "MCP-сервер для Яндекс Трекера (API v3): позволяет Claude и другим MCP-клиентам читать и изменять задачи"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "skyfox-fur"},
]
keywords = ["mcp", "yandex", "tracker", "api", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/skyfox-fur/yandex_tracker_mcp"
Issues = "https://github.com/skyfox-fur/yandex_tracker_mcp/issues"

[project.scripts]
yandex-tracker-mcp = "yandex_tracker_mcp:main"

[tool.setuptools]
py-modules = ["yandex_tracker_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.pytest.ini_options]
testpaths = ["tests"]
