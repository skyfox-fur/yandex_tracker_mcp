[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-tracker-mcp"
dynamic = ["version"]
description = "MCP server for Yandex Tracker: lets Claude and other MCP clients read and update issues"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "skyfox-fur" }]
keywords = ["mcp", "model-context-protocol", "yandex", "tracker", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.10"]

[project.urls]
Repository = "https://github.com/skyfox-fur/yandex_tracker_mcp"
Issues = "https://github.com/skyfox-fur/yandex_tracker_mcp/issues"
Changelog = "https://github.com/skyfox-fur/yandex_tracker_mcp/blob/main/CHANGELOG.md"

[project.scripts]
yandex-tracker-mcp = "yandex_tracker_mcp.server:main"

[tool.setuptools.dynamic]
version = { attr = "yandex_tracker_mcp.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["yandex_tracker_mcp", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
