[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-tracker-mcp"
version = "0.1.0"
description = "MCP-сервер для Яндекс Трекера (API v3): позволяет Claude и другим MCP-клиентам читать и изменять задачи"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "skyfox-fur"},
]
keywords = ["mcp", "yandex", "tracker", "api", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/skyfox-fur/yandex_tracker_mcp"
Issues = "https://github.com/skyfox-fur/yandex_tracker_mcp/issues"

[project.scripts]
yandex-tracker-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
